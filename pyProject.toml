[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon"
version = "0.1.0"
description = "Personalized tech news digest with an implicit feedback loop"
requires-python = ">=3.11"
dependencies = [
    # Phase 1
    "aiohttp>=3.9",
    "feedparser>=6.0",
    "sentence-transformers>=2.7",
    "numpy>=1.26",
    "click>=8.1",
    "python-dotenv>=1.0",
    "trafilatura>=1.9",   # article text extraction — used in Phase 4 but cheap to add now
    # Phase 2 (add when ready)
    "redis>=5.0",
    "requests"
    # "python-telegram-bot>=21.0",
    # Phase 3 (add when ready)
    "APScheduler>=3.10",
    # Phase 4 (add when ready)
    # "fastapi>=0.111",
    # "uvicorn>=0.29",
    # "httpx>=0.27",
    # Phase 5 (add when ready)
    # "jinja2>=3.1",
    # "sendgrid>=6.11",
]

[project.scripts]
horizon = "horizon.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["horizon"]